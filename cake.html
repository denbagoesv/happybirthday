<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baking the Surprise... 🎂</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600;700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling khusus angka hitung mundur agar besar & glowing */
    .countdown-number {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 800;
      color: var(--secondary);
      text-shadow: 0 0 30px var(--primary-glow);
      margin-top: 1rem;
      animation: pulseCountdown 0.8s ease infinite alternate;
    }
    @keyframes pulseCountdown {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div id="cursor"></div>
  <div id="cursor-trail"></div>

  <!-- Background Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="loading-container">
    <div class="hero-glow glow-1"></div>
    <div class="hero-glow glow-3"></div>

    <!-- Small SVG Cake illustration -->
    <div class="loading-cake">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Plate -->
        <ellipse cx="100" cy="160" rx="75" ry="12" fill="var(--mid)" stroke="var(--border-glass)" stroke-width="2"/>
        
        <!-- Bottom Layer (Chocolate) -->
        <path d="M40 120 C 40 120, 100 130, 160 120 L 160 150 C 160 150, 100 160, 40 150 Z" fill="#8d5b4c" />
        <path d="M40 120 C 70 128, 130 128, 160 120" fill="none" stroke="var(--primary)" stroke-width="4"/>
        
        <!-- Middle Layer (Vanilla/Cream) -->
        <path d="M48 90 C 48 90, 100 98, 152 90 L 152 120 C 152 120, 100 128, 48 120 Z" fill="#f7ede2" />
        <path d="M48 90 C 70 96, 130 96, 152 90" fill="none" stroke="var(--secondary)" stroke-width="3"/>

        <!-- Top Layer (Berry) -->
        <path d="M58 65 C 58 65, 100 72, 142 65 L 142 90 C 142 90, 100 96, 58 90 Z" fill="var(--lilac)" />
        <path d="M58 65 C 70 70, 130 70, 142 65" fill="none" stroke="#fff8f0" stroke-width="2"/>

        <!-- Candles -->
        <rect x="97" y="35" width="6" height="30" fill="var(--secondary)" rx="2"/>
        <path d="M100 20 Q105 28 100 35 Q95 28 100 20 Z" fill="var(--primary)" opacity="0.95"/>
        
        <rect x="72" y="42" width="6" height="23" fill="var(--accent)" rx="2"/>
        <path d="M75 30 Q80 37 75 42 Q70 37 75 30 Z" fill="var(--secondary)" opacity="0.9"/>
        
        <rect x="122" y="42" width="6" height="23" fill="var(--accent)" rx="2"/>
        <path d="M125 30 Q130 37 125 42 Q120 37 125 30 Z" fill="var(--secondary)" opacity="0.9"/>
      </svg>
    </div>

    <!-- Status Loading Message -->
    <h1 class="loading-text">Get Ready, Adel! 🎂</h1>
    <p class="loading-subtext" id="status-desc">Opening the surprise in...</p>

    <!-- Countdown Display -->
    <div class="countdown-number" id="countdown-display">3</div>
  </div>

  <!-- Shared Javascript -->
  <script src="shared.js"></script>
  <script>
    const statusDesc = document.getElementById("status-desc");
    const countdownDisplay = document.getElementById("countdown-display");

    const recipientName = activeConfig ? activeConfig.name : "Adel";
    document.querySelector(".loading-text").textContent = `Baking Surprise for ${recipientName}! 🎂`;

    let count = 3;

    const countdownTimer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownDisplay.textContent = count;
        if (count === 2) {
          statusDesc.textContent = "Almost there...";
        } else if (count === 1) {
          statusDesc.textContent = "Here it comes! ✨";
        }
      } else {
        clearInterval(countdownTimer);
        countdownDisplay.textContent = "🎉";
        statusDesc.textContent = "Happy Birthday!";
        
        // Final chime sound
        playSuccessChime();

        // Redirect ke halaman perayaan
        setTimeout(() => {
          window.location.href = "celebration.html";
        }, 400);
      }
    }, 1000); // Berjalan tiap 1 detik per angka
  </script>
</body>
</html>
